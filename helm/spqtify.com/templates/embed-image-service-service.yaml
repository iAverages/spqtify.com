apiVersion: v1
kind: Service
metadata:
  name: {{ include "spqtify.com.embedImageService.fullname" . }}
  labels:
    {{- include "spqtify.com.labels" . | nindent 4 }}
    app.kubernetes.io/component: embed-image-service
spec:
  type: {{ index .Values "embed-image-service" "service" "type" }}
  selector:
    {{- include "spqtify.com.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: embed-image-service
  ports:
    - name: http
      port: {{ index .Values "embed-image-service" "service" "port" }}
      targetPort: http
      protocol: TCP
